# Default public pilot config (timm ViT baseline)
# See also: pilot_public_dinov3.yaml, pilot_public_retfound.yaml

seed: 42

data:
  train_csv: data/pilot/aptos_train.csv
  val_csv: data/pilot/aptos_val.csv
  test_csv: data/pilot/messidor_test.csv
  image_col: image_path
  label_col: label
  patient_col: patient_id
  image_root: data/pilot/images
  binary_label: false
  subgroup_columns: []

model:
  name: timm
  backbone: vit_base_patch16_224
  image_size: 224
  num_classes: 2
  freeze_backbone: false
  pretrained: true

train:
  batch_size: 8
  num_workers: 2
  epochs: 10
  learning_rate: 1.0e-4
  early_stop_patience: 4

eval:
  bootstrap_samples: 500

output:
  dir: results/pilot/timm_vit_base

experiment: exp1
